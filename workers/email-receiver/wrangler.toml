name = "zaines-email-receiver"
main = "src/index.ts"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Secrets — set via wrangler CLI:
#   wrangler secret put FORWARD_TO              (e.g. davidtraversmailbox@gmail.com)
#   wrangler secret put APP_URL                 (https://zainesstayandplay.com)
#   wrangler secret put INBOUND_WEBHOOK_SECRET  (same value as Vercel env var)
