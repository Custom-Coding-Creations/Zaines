name: CI
on:
  push:
    branches: [main, 'premerge/**']
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install

      - name: Install framework dependencies
        run: pnpm --dir .github/framework install

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Run TypeScript type checking
        run: pnpm run typecheck

      - name: Run linter
        run: pnpm run lint

      - name: Enforce agent autonomy policy
        run: pnpm run lint:agents

      - name: Run tests
        run: pnpm test

      - name: Build application
        run: pnpm run build
        env:
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Start production server for hard gates
        run: pnpm start &
        env:
          PORT: 3000
          NODE_ENV: production
          SKIP_ENV_VALIDATION: true
          ISSUE66_BASE_URL: http://localhost:3000
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          AUTH_SECRET: test-secret-for-ci
          NEXTAUTH_SECRET: test-secret-for-ci
          ADMIN_AUTH_SECRET: test-admin-secret
          CUSTOMER_AUTH_SECRET: test-customer-secret
          AUTH_URL: http://localhost:3000
          NEXTAUTH_URL: http://localhost:3000

      - name: Wait for server to be ready
        run: |
          timeout 60 bash -c 'until curl -sf http://localhost:3000 > /dev/null; do sleep 1; done'

      - name: Run hard quality gates
        run: pnpm run audit:issue66:gates:ci
        env:
          ISSUE66_BASE_URL: http://localhost:3000
