name: ForgeCI Self-Hosted CI Pipeline
on:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".claude/**"
      - "LICENSE"
  pull_request:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - ".claude/**"
      - "LICENSE"

jobs:
  quality:
    name: Lint, Test & Build
    runs-on: [linux, amd64, docker]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zaines_ci
        ports:
          - 5432:5432
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        run: corepack enable

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile=false --prefer-offline

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Run App Tests
        run: pnpm run test:app

      - name: Build
        run: pnpm run build
